    <input name="aliq" inputmode="decimal" placeholder="%" value="${pct(f.aliq)}" style="padding:9px 8px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:15px;min-width:0">
    <button type="button" class="x" data-fdel aria-label="Tirar faixa">×</button></div>`;
  abrirFolha(`
    ${cabecalho(id ? 'Editar regra' : 'Nova regra', 'IOF e Imposto de Renda')}
    ${campo('nome', 'Nome da regra', r.nome, 'placeholder="Ex.: LCI, Tesouro" required')}
    <label class="toggle"><span>Cobra IOF se resgatar antes de 30 dias<small style="display:block;color:var(--muted)">Tabela regressiva: 96% do rendimento no 1º dia, até 0% no 30º</small></span><input type="checkbox" name="iof" ${r.iof ? 'checked' : ''}></label>
    <div class="tag" style="margin:6px 0 4px">Imposto de Renda sobre o rendimento, por prazo</div>
    <div class="xhead" style="grid-template-columns:1fr 1fr 32px"><span>Até (dias)</span><span>Alíquota %</span><span></span></div>
    <div id="faixas">${r.ir.map(linha).join('')}</div>
    <p style="margin:0 0 6px"><button type="button" class="mini" data-fadd>+ Adicionar faixa</button></p>
    <p class="note">Deixe "Até" vazio na última faixa (acima de tudo). Sem faixas = sem Imposto de Renda.</p>
    <div class="actions">${id && !['cdb', 'nenhum'].includes(id) ? '<button type="button" class="btn-del" data-del>Excluir</button>' : ''}<button type="submit" class="btn-save">Salvar</button></div>`, {
    onSubmit() {
      const f = $('form'), nome = f.nome.value.trim(); if (!nome) return f.nome.focus();
      const ir = [...document.querySelectorAll('#faixas .faixa')].map(d => {
        const at = d.querySelector('[name=ate]').value.trim(), al = d.querySelector('[name=aliq]').value.trim();
        return al ? { ate: at ? parseInt(at) : null, aliq: parseBRL(al) } : null;
      }).filter(Boolean);
      const k = id || 'r' + uid();
      state.aplic.regras[k] = { nome, iof: f.iof.checked, ir };
      return true;
    },
    onClick(ev) {
      if (ev.target.closest('[data-fadd]')) { $('faixas').insertAdjacentHTML('beforeend', linha({ ate: null, aliq: '' })); return; }
      const d = ev.target.closest('[data-fdel]'); if (d) { d.closest('.faixa').remove(); return; }
      if (ev.target.closest('[data-del]')) return perguntar('Excluir esta regra? As aplicações que usam ela passam para "Sem imposto".', 'Excluir').then(ok => {
        if (ok) { delete state.aplic.regras[id]; state.aplic.itens.forEach(a => { if (a.regra === id) a.regra = 'nenhum'; }); }
        return ok;
      });
    },
  });
}

function aplicAcao(acao, id) {
  const ym = mesPadraoC6();
  if (acao === 'novo') return abrirAplic(null, ym);
  if (acao === 'item') return abrirAplic(state.aplic.itens.find(y => y.id === id), ym);
  if (acao === 'cel') { const [cid, m] = id.split('|'); return abrirCelAplic(cid, m); }
  if (acao === 'regras') return abrirRegras();
}

// ================= Total geral e gráficos =================
function totalVazio() { return { fotos: {} }; } // uma "foto" do patrimônio por mês, para a linha de evolução
function completaTotal(s) { s.total = { ...totalVazio(), ...(s.total || {}) }; return s; }

let pizzaSel = null, barraSel = null;
const CORES_S = ['var(--s1)', 'var(--s2)', 'var(--s3)', 'var(--s4)', 'var(--s5)', 'var(--s6)'];
const mil = v => v >= 1000 ? `${String(Math.round(v / 100) / 10).replace('.', ',')} mil` : String(Math.round(v));

// Quanto você tem: carteira C6 + poupança + aplicações (líquidas). Toca Lab e Dumbo ficam fora do total.
function totalPatrimonio() {
  const c6 = c6Caixa(), po = poupCaixa(), ap = aplicMes(hojeISO().slice(0, 7));
  const partes = [
    { k: 'c6', nome: 'Carteira C6', valor: c6 ? c6.saldo : null, ir: 'c6-resumo', nota: c6 && c6.aPagar ? `faturas fechadas a pagar: ${money(c6.aPagar)}` : '' },
    { k: 'poup', nome: 'Itaú Poupança', valor: po ? po.saldo : null, ir: 'poup-resumo', nota: '' },
    { k: 'aplic', nome: 'Aplicações (líquido)', valor: ap.itens.length ? ap.liquido : null, ir: 'aplic-resumo', nota: ap.itens.length && ap.impostos ? `bruto ${money(ap.total)}, impostos ${money(ap.impostos)}` : '' },
  ];
  const total = sum(partes.map(p => p.valor || 0));
  return { partes, total, algum: partes.some(p => p.valor !== null) };
}
function totalFoto() {
  const p = totalPatrimonio(); if (!p.algum) return;
  const ym = hojeISO().slice(0, 7), f = state.total.fotos;
  const nova = { data: hojeISO(), c6: p.partes[0].valor, poup: p.partes[1].valor, aplic: p.partes[2].valor, total: p.total };
  if (JSON.stringify(f[ym]) !== JSON.stringify(nova)) { f[ym] = nova; save(); }
}

// Despesas pessoais do período (mês escolhido ou ano todo): cartão C6, Pix/débito, fixos, parte do Itaú paga pelo C6 e extras da Poupança
function totalDespesas() {
  const yms = view.mes === 'ano' ? MESES.map((_, i) => ymDe(view.ano, i)) : [ymDe(view.ano, view.mes)];
  const itens = [];
  yms.forEach(ym => { const m = c6Mes(ym); if (!(m.antes && !m.temDados)) itens.push(...c6ItensCat(m)); });
  state.poup.gastos.filter(g => !g.toca && yms.includes(g.data.slice(0, 7))).forEach(g => itens.push({ cat: g.cat || 'Sem categoria', valor: g.valor }));
  yms.forEach(ym => { const m = poupMes(ym); if (m.taxa.valor) itens.push({ cat: 'Taxa da Poupança', valor: m.taxa.valor }); if (m.plano.valor) itens.push({ cat: 'Plano de saúde', valor: m.plano.valor }); });
  return c6Categorias(itens); // [[categoria, valor]] do maior para o menor
}

function arcoPizza(cx, cy, R, r, a0, a1) {
  if (a1 - a0 >= Math.PI * 2 - 1e-4) a1 = a0 + Math.PI * 2 - 1e-4;
  const p = (rad, a) => [(cx + rad * Math.sin(a)).toFixed(2), (cy - rad * Math.cos(a)).toFixed(2)];
  const g = a1 - a0 > Math.PI ? 1 : 0, [x0, y0] = p(R, a0), [x1, y1] = p(R, a1), [x2, y2] = p(r, a1), [x3, y3] = p(r, a0);
  return `M${x0} ${y0}A${R} ${R} 0 ${g} 1 ${x1} ${y1}L${x2} ${y2}A${r} ${r} 0 ${g} 0 ${x3} ${y3}Z`;
}

function renderTotal() {
  totalFoto();
  const pat = totalPatrimonio(), periodo = view.mes === 'ano' ? `${view.ano}` : `${nomeMes(ymDe(view.ano, view.mes))} de ${view.ano}`;

  // ---- patrimônio ----
  const comValor = pat.partes.filter(p => p.valor !== null && p.valor > 0);
  const linhaP = (p, i) => linhaC6(`<span class="dot" style="background:${CORES_S[i]}"></span>${p.nome}`,
    p.valor === null ? 'toque para informar o saldo' : `${pat.total > 0 && p.valor > 0 ? Math.round(p.valor / pat.total * 100) + '% do total' : ''}${p.nota ? (pat.total > 0 && p.valor > 0 ? ' · ' : '') + p.nota : ''}`,
    p.valor === null ? '–' : money(p.valor), `data-total="ir" data-rid="${p.ir}"`);
  let conta = null, dumbo = null;
  try { if (state.conta.inicio) conta = contaCalc(hojeISO()); } catch (e) {}
  try { dumbo = dumboCaixa(); } catch (e) {}
  const split = comValor.length ? `<div class="split" style="margin:0 14px 6px">${pat.partes.map((p, i) => p.valor > 0 ? `<i style="width:${p.valor / pat.partes.reduce((s, q) => s + Math.max(0, q.valor || 0), 0) * 100}%;background:${CORES_S[i]}"></i>` : '').join('')}</div>` : '';

  // ---- pizza ----
  const cats = totalDespesas(), totDesp = sum(cats.map(c => c[1]));
  let fatias = cats.slice(0, 5);
  if (cats.length > 6) fatias.push(['Outras', sum(cats.slice(5).map(c => c[1]))]); else fatias = cats.slice(0, 6);
  if (pizzaSel !== null && pizzaSel >= fatias.length) pizzaSel = null;
  let ang = 0;
  const arcos = fatias.map(([k, v], i) => {
    const a0 = ang, a1 = ang + v / totDesp * Math.PI * 2; ang = a1;
    const cor = k === 'Outras' ? 'var(--sOutras)' : CORES_S[i];
    return `<path d="${arcoPizza(100, 100, pizzaSel === i ? 78 : 72, 46, a0, a1)}" fill="${cor}" stroke="var(--surface)" stroke-width="2" data-total="pizza" data-rid="${i}" style="cursor:pointer"><title>${esc(k)}: ${money(v)}</title></path>`;
  }).join('');
  const sel = pizzaSel !== null ? fatias[pizzaSel] : null;
  const centro = sel
    ? `<text x="100" y="94" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(sel[0].length > 13 ? sel[0].slice(0, 12) + '…' : sel[0])}</text><text x="100" y="110" text-anchor="middle" font-size="13" font-weight="700" fill="var(--text)">${money(sel[1])}</text><text x="100" y="124" text-anchor="middle" font-size="10" fill="var(--muted)">${Math.round(sel[1] / totDesp * 100)}%</text>`
    : `<text x="100" y="97" text-anchor="middle" font-size="10" fill="var(--muted)">Total</text><text x="100" y="114" text-anchor="middle" font-size="14" font-weight="700" fill="var(--text)">${money(totDesp)}</text>`;
  const legenda = fatias.map(([k, v], i) => `<div class="row click ${pizzaSel === i ? 'sel' : ''}" data-total="pizza" data-rid="${i}"><div class="t"><span class="dot" style="background:${k === 'Outras' ? 'var(--sOutras)' : CORES_S[i]}"></span>${esc(k)}</div><div class="v num">${money(v)} <small class="mut">${Math.round(v / totDesp * 100)}%</small></div></div>`).join('');
  const restantes = cats.length > 6 ? `<details style="padding:0 14px 12px"><summary class="mut" style="cursor:pointer;font-size:13px">Ver todas as ${cats.length} categorias</summary>${cats.map(([k, v]) => `<div class="row"><div class="t">${esc(k)}</div><div class="v num">${money(v)}</div></div>`).join('')}</details>` : '';

  // ---- barras: entradas × saídas por mês (conta pessoal, C6) ----
  const meses = MESES.map((_, i) => c6Mes(ymDe(view.ano, i))).map(m => (m.antes && !m.temDados) ? { e: 0, s: 0 } : { e: m.entradas, s: m.saidas });
  const maxV = Math.max(1, ...meses.flatMap(m => [m.e, m.s])), passo = Math.pow(10, Math.floor(Math.log10(maxV))), topo = Math.ceil(maxV / passo) * passo;
  const W = 360, H = 190, L = 40, R2 = 6, T = 10, B = 22, pw = W - L - R2, ph = H - T - B, gw = pw / 12, bw = 8, y = v => T + ph - v / topo * ph;
  const barra = (v, x, cor) => v > 0 ? `<rect x="${x.toFixed(1)}" y="${y(v).toFixed(1)}" width="${bw}" height="${(T + ph - y(v) + 3).toFixed(1)}" rx="3" fill="${cor}"/>` : '';
  const grupos = meses.map((m, i) => {
    const cx = L + gw * i + gw / 2;
    return `<g clip-path="url(#base)">${barra(m.e, cx - bw - 1, 'var(--s1)')}${barra(m.s, cx + 1, 'var(--s2)')}</g>
      <rect x="${(L + gw * i).toFixed(1)}" y="${T}" width="${gw.toFixed(1)}" height="${ph}" fill="${barraSel === i ? 'var(--text)' : 'transparent'}" fill-opacity="0.07" data-total="barra" data-rid="${i}" style="cursor:pointer"/>
      <text x="${cx.toFixed(1)}" y="${H - 7}" text-anchor="middle" font-size="9" fill="${barraSel === i ? 'var(--text)' : 'var(--muted)'}">${MESES[i]}</text>`;
  }).join('');
  const grade = [0, topo / 2, topo].map(v => `<line x1="${L}" x2="${W - R2}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${L - 5}" y="${(y(v) + 3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--muted)">${mil(v)}</text>`).join('');
  const bs = barraSel !== null ? meses[barraSel] : null;
  const temBarras = meses.some(m => m.e || m.s);
  const tabela = `<details style="padding:0 14px 12px"><summary class="mut" style="cursor:pointer;font-size:13px">Ver em tabela</summary><table style="margin-top:6px"><thead><tr><th>Mês</th><th>Entradas</th><th>Saídas</th></tr></thead><tbody>${meses.map((m, i) => `<tr style="cursor:default"><td>${MESES_LONGOS[i]}</td><td class="num">${m.e ? num(m.e) : '–'}</td><td class="num">${m.s ? num(m.s) : '–'}</td></tr>`).join('')}</tbody></table></details>`;

  // ---- evolução do patrimônio (fotos mensais) ----
  const fotos = Object.entries(state.total.fotos).sort(), nF = fotos.length;
  let evolucao;
  if (nF < 2) {
    evolucao = `<div class="empty">O app guarda uma foto do seu total por mês. A linha aparece quando houver dois meses. Já guardei a de ${nF ? rotuloYm(fotos[0][0]) : 'este mês'}: ${nF ? money(fotos[0][1].total) : '–'}.</div>`;
  } else {
    const vals = fotos.map(([, f]) => f.total), lo = Math.min(...vals), hi = Math.max(...vals), pad = (hi - lo) * 0.25 || hi * 0.05 || 1;
    const idx = ym => mesesEntre(fotos[0][0], ym).length - 1, nM = idx(fotos[nF - 1][0]) || 1;
    const EW = 360, EH = 150, EL = 12, ER = 12, ET = 26, EB = 24, X = ym => EL + (EW - EL - ER) * idx(ym) / nM, Y = v => ET + (EH - ET - EB) * (1 - (v - (lo - pad)) / ((hi + pad) - (lo - pad)));
    const pts = fotos.map(([ym, f]) => [X(ym), Y(f.total), ym, f.total]);
    const ult = pts[pts.length - 1], pri = pts[0];
    evolucao = `<svg viewBox="0 0 ${EW} ${EH}" style="width:100%;height:auto;display:block;padding:0 4px" role="img" aria-label="Evolução do patrimônio mês a mês">
      <polyline points="${pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"><title>${rotuloYm(p[2])}: ${money(p[3])}</title></circle>`).join('')}
      <text x="${pri[0].toFixed(1)}" y="${(pri[1] - 10).toFixed(1)}" font-size="10" fill="var(--text)" text-anchor="start">${money(pri[3])}</text>
      <text x="${ult[0].toFixed(1)}" y="${(ult[1] - 10).toFixed(1)}" font-size="10" font-weight="700" fill="var(--text)" text-anchor="end">${money(ult[3])}</text>
      <text x="${pri[0].toFixed(1)}" y="${EH - 6}" font-size="10" fill="var(--muted)" text-anchor="start">${rotuloYm(pri[2])}</text>
      <text x="${ult[0].toFixed(1)}" y="${EH - 6}" font-size="10" fill="var(--muted)" text-anchor="end">${rotuloYm(ult[2])}</text></svg>`;
  }

  return `
    <section class="box"><header><h2>Quanto eu tenho<small>carteira C6 + poupança + aplicações (líquido), hoje</small></h2></header>
      <div class="kpi" style="padding-bottom:8px"><div class="big" style="font-size:32px">${money(pat.total)}</div></div>
      ${split}
      <div class="rows">${pat.partes.map(linhaP).join('')}</div>
    </section>

    <section class="box"><header><h2>Fora do total<small>dinheiro que não é só seu</small></h2></header><div class="rows">
      ${conta ? linhaC6('Toca Lab · seu líquido', 'a empresa te deve (sai como pró-labore ou lucros)', money(conta.seu), 'data-total="ir" data-rid="conta"') : linhaC6('Toca Lab', 'configure a Conta Itaú Empresa', '–', 'data-total="ir" data-rid="conta"')}
      ${conta ? linhaC6('Toca Lab · caixa da empresa', 'reserva para boletos e colchão', money(conta.caixa), 'data-total="ir" data-rid="conta"') : ''}
      ${linhaC6('Conta Dumbo', 'caixa da Dumbo House', dumbo ? money(dumbo.saldo) : '–', 'data-total="ir" data-rid="dumbo-resumo"')}
    </div></section>

    <section class="box"><header><h2>Para onde vai o dinheiro<small>despesas de ${periodo} · toque numa fatia</small></h2></header>
      ${cats.length ? `<svg viewBox="0 0 200 200" style="width:min(100%,260px);height:auto;display:block;margin:0 auto" role="img" aria-label="Despesas por categoria em ${periodo}">${arcos}${centro}</svg>
      <div class="rows">${legenda}</div>${restantes}
      <p class="hint" style="padding:0 14px 12px;margin:0">Conta cartão C6, Pix e débito, fixos, a parte do Itaú paga pelo C6, e da Poupança os gastos extras, a taxa e o plano de saúde. Fora: o que é da Toca Lab e tudo da Dumbo.</p>`
      : `<div class="empty">Nenhuma despesa com categoria em ${periodo}.</div>`}
    </section>

    <section class="box"><header><h2>Entradas × saídas · ${view.ano}<small>conta pessoal (C6) · toque num mês</small></h2></header>
      ${temBarras ? `<div style="padding:0 8px"><svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block" role="img" aria-label="Entradas e saídas por mês">
        <defs><clipPath id="base"><rect x="${L}" y="${T}" width="${pw}" height="${ph}"/></clipPath></defs>${grade}${grupos}</svg></div>
      <div style="display:flex;gap:14px;padding:4px 14px 8px;font-size:12px;color:var(--muted)"><span><span class="dot" style="background:var(--s1)"></span>Entradas</span><span><span class="dot" style="background:var(--s2)"></span>Saídas</span></div>
      ${bs ? `<div class="alert good" style="margin:0 14px 12px;background:var(--surface-2);color:var(--text)"><b>${MESES_LONGOS[barraSel]}</b>: entradas ${money(bs.e)} · saídas ${money(bs.s)} · <b class="${bs.e - bs.s < 0 ? 'neg' : 'pos'}">${bs.e - bs.s < 0 ? 'faltou' : 'sobrou'} ${money(Math.abs(bs.e - bs.s))}</b></div>` : ''}
      ${tabela}` : '<div class="empty">Sem entradas ou saídas lançadas em ' + view.ano + '.</div>'}
    </section>

    <section class="box"><header><h2>Evolução do patrimônio<small>uma foto do total por mês</small></h2></header>${evolucao}</section>`;
}

function totalAcao(a, id) {
  if (a === 'ir') return irPara(id === 'conta' ? 'conta' : id);
  if (a === 'pizza') { pizzaSel = pizzaSel === +id ? null : +id; return render(); }
  if (a === 'barra') { barraSel = barraSel === +id ? null : +id; return render(); }

// ================= Configurações =================
// Onde a categoria aparece: C6 (cartão, Pix/débito, fixos, categorias lembradas da importação), Itaú Crédito e gastos extras da Poupança
function listasComCategoria() {
  return [state.c6.compras, state.c6.gastos, state.c6.fixos, state.credito.compras, state.poup.gastos, Object.values(state.c6.regras)];
}
function usosCategoria(nome) {
  return listasComCategoria().slice(0, 5).reduce((n, l) => n + l.filter(x => x.cat === nome).length, 0);
}
function trocarCategoria(de, para) {
  listasComCategoria().forEach(l => l.forEach(x => { if (x.cat === de) x.cat = para; }));
}
// Lista completa: as categorias cadastradas + as que estão em uso mas ficaram fora da lista (ex.: digitadas na Poupança)
function todasCategorias() {
  const usadas = listasComCategoria().slice(0, 5).flatMap(l => l.map(x => x.cat)).filter(Boolean);
  return [...new Set([...state.c6.categorias, ...usadas])];
}

      <div class="rows">${cats.map(k => { const n = usosCategoria(k); return linhaC6(esc(k), `${n ? `${n} ${n === 1 ? 'lançamento' : 'lançamentos'}` : 'sem uso'}${fora(k) ? ' · digitada na Poupança' : ''}`, '', `data-cfg="cat" data-rid="${esc(k)}"`); }).join('')}</div>

    <section class="box"><header><h2>Ajustes de cada aba</h2></header><div class="rows">

      ${ajuste('Poupança', 'taxa mensal, plano de saúde, início do controle', 'poup')}
      ${ajuste('Aplicações', 'regras de imposto (IOF e Imposto de Renda)', 'regras')}
    </div></section>

    ${NUVEM.url ? `<section class="box"><header><h2>Conta e sincronização<small>mesmos dados no celular e no computador</small></h2></header><div class="rows">
      ${sessao
        ? linhaC6(esc(sessao.user.email), '<span data-sync-status></span>', '', 'data-cfg="sync"') + linhaC6('Sair da conta', 'os dados continuam neste aparelho', '', 'data-cfg="sair"')

const NUVEM = { url: 'https://zapchkbyhtivlvtgwbzb.supabase.co', chave: 'sb_publishable_QFR_AbeOuGwqIWOjtcBOgw_ZYez82Cs' }; // endereço e chave pública do projeto no Supabase (preenchidos na configuração)
const SUPABASE_JS = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js';
const SYNC_KEY = KEY + '.sync'; // { em: versão da nuvem que este aparelho conhece, sujo: há mudança local ainda não enviada }
let nuvem = null, sessao = null, syncEstado = 'local', ultimaSync = null, envioTimer = null, enviando = false;

function syncInfo() { try { return JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; } catch (e) { return {}; } }
function syncGrava(x) { try { localStorage.setItem(SYNC_KEY, JSON.stringify({ ...syncInfo(), ...x })); } catch (e) {} }
function completaTudo(s) {
  s.conta = { ...contaVazia(), ...(s.conta || {}) };
  s.conta.cfg = { ...CFG_PADRAO, ...s.conta.cfg };
  return completaTotal(completaAplic(completaDumbo(completaCredito(completaPoup(completaC6(s))))));

function syncTexto() {
  if (!NUVEM.url) return '';

  return {

  }[syncEstado] || '';
}

function iniciarNuvem() {
  if (!NUVEM.url || !NUVEM.chave) return;
  const s = document.createElement('script');
  s.src = SUPABASE_JS;
  s.onload = async () => {
    nuvem = window.supabase.createClient(NUVEM.url, NUVEM.chave);
    const { data } = await nuvem.auth.getSession();
    sessao = data.session;
    nuvem.auth.onAuthStateChange((ev, s2) => { sessao = s2; renderStatus(); if (ev === 'PASSWORD_RECOVERY') setTimeout(abrirNovaSenha, 300); });
    if (sessao) puxar(); else render();
  };
  s.onerror = () => { syncEstado = 'offline'; renderStatus(); };
  document.head.appendChild(s);
}

// Busca a versão da nuvem e decide o que fazer
async function puxar() {
  if (!sessao) return;
  const { data, error } = await nuvem.from('app_state').select('data, updated_at').eq('user_id', sessao.user.id).maybeSingle();
  if (error) { syncEstado = navigator.onLine ? 'erro' : 'offline'; return renderStatus(); }
  const info = syncInfo();
  if (!data) { // nuvem vazia: envia o que tem aqui (menos os dados de exemplo)
    if (state.exemplo) { syncEstado = 'vazio'; return renderStatus(); }
    return enviar();
  }
  if (data.updated_at === info.em) { // nada mudou na nuvem
    if (info.sujo) return enviar();
    syncEstado = 'ok'; ultimaSync = new Date(); return renderStatus();
  }
  if (state.exemplo || !info.sujo) return aplicarNuvem(data); // só a nuvem mudou: usa ela
  conflito(data); // mudou dos dois lados
}
function aplicarNuvem(row) {
  state = completaTudo(row.data);
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  syncGrava({ em: row.updated_at, sujo: false });
  syncEstado = 'ok'; ultimaSync = new Date();
  render();
}
async function conflito(row) {
  const nuvemMaisNova = await perguntar('Os dados mudaram em outro aparelho e também neste, desde a última sincronização. Qual versão você quer manter? (A outra se perde. Se estiver em dúvida, baixe um backup antes.)', 'Usar a do outro aparelho', false, 'Manter a deste aparelho');
  if (nuvemMaisNova) return aplicarNuvem(row);
  syncGrava({ em: row.updated_at, sujo: true });
  enviar();
}

function agendarEnvio() { if (!sessao) return; clearTimeout(envioTimer); envioTimer = setTimeout(enviar, 1500); }
async function enviar() {
  if (!sessao) return;
  if (enviando) return agendarEnvio();
  enviando = true; syncEstado = 'enviando'; renderStatus();
  const info = syncInfo(), agora = new Date().toISOString(), uid = sessao.user.id;
  // só grava por cima se a nuvem ainda estiver na versão que este aparelho conhece (senão alguém mudou antes)
  const res = info.em
    ? await nuvem.from('app_state').update({ data: state, updated_at: agora }).eq('user_id', uid).eq('updated_at', info.em).select('updated_at')
    : await nuvem.from('app_state').insert({ user_id: uid, data: state, updated_at: agora }).select('updated_at');
  enviando = false;
  if (res.error) {
    if (res.error.code === '23505') return puxar(); // já existia na nuvem
    syncEstado = navigator.onLine ? 'erro' : 'offline'; return renderStatus();
  }
  if (!res.data || !res.data.length) return puxar();
  syncGrava({ em: res.data[0].updated_at, sujo: false });
  syncEstado = 'ok'; ultimaSync = new Date(); renderStatus();
}

function baixarBackup() {

function restaurarBackup() {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = '.json,application/json';
  input.onchange = async () => {
    try {
      const s = JSON.parse(await input.files[0].text());

function renderContaMes(ym) {
  const M = contaMes(ym);
  if (!M) {
    const antes = ym < state.conta.inicio.data.slice(0, 7);
    return `${avisoExemplo()}<section class="box"><div class="empty" style="padding:28px 16px">
      ${antes ? `O controle da conta começa em <b>${dataCurta(state.conta.inicio.data)}</b>.<br>Esse mês fica antes do ponto de partida.` : 'Esse mês ainda não chegou.'}
      </div></section>${linkConfig}`;
  }
  const r = M.r, cfg = r.cfg, c = state.conta, nomeMes = MESES_LONGOS[+ym.slice(5) - 1];
  const total = Math.max(r.saldo, 0.01);
  const pE = Math.max(0, Math.min(100, r.caixa / total * 100)), pS = Math.max(0, Math.min(100, r.seu / total * 100));

  const ultimaConf = c.conferencias[c.conferencias.length - 1];
  let conf = 'Ainda não conferido com o app do banco.';
  if (ultimaConf) {
    const dif = round2(ultimaConf.banco - r.saldo);
    conf = Math.abs(dif) < 0.01
      ? `<span class="ok">✓ Bateu com o banco</span> em ${dataCurta(ultimaConf.data)}`
      : `<span class="bad">Diferença de ${money(dif)}</span> na conferência de ${dataCurta(ultimaConf.data)}`;
  }

  // Pró-labore
  const qtd = r.seu > 0 ? Math.floor(r.seu / cfg.prolabore) : 0;
  const resto = r.seu > 0 ? round2(r.seu - qtd * cfg.prolabore) : r.seu;
  const prog = Math.max(0, Math.min(100, resto / cfg.prolabore * 100));
  const textoPL = r.seu < 0
    ? `Seu líquido está negativo: o que a empresa já pagou (pró-labores, INSS, contador) passou do que entrou de NFs. Se o ponto de partida estiver incompleto, ajuste em Configurações quanto do saldo inicial era seu.`
    : qtd >= 1
      ? `Já dá para retirar <b>${qtd} pró-labore${qtd > 1 ? 's' : ''}</b>. Sobrariam ${money(resto)} acumulados.`
      : `Faltam <b>${money(cfg.prolabore - resto)}</b> para completar o próximo pró-labore (${money(cfg.prolabore)}).`;

  // Colchão
  const pC = Math.max(0, Math.min(100, r.folga / cfg.colchao * 100));
  let alertaCaixa = '';
  if (r.folga < 0) alertaCaixa = `<div class="alert">⚠ O caixa não cobre os boletos: faltam ${money(-r.folga)}. Se precisar pagar agora, use "Paguei do meu bolso" — a empresa te devolve.</div>`;
  else if (r.folga < cfg.colchao) alertaCaixa = `<div class="alert warn">O colchão está abaixo da meta. Faltam ${money(cfg.colchao - r.folga)} para chegar a ${money(cfg.colchao)}.</div>`;
  else alertaCaixa = `<div class="alert good">✓ Colchão completo. Os boletos podem sair da conta da empresa.</div>`;

  const linhaObrig = o => o.pago ? `
    <div class="row">
      <div class="t">${esc(o.nome)}<small>pago em ${dataCurta(o.pago.data)} · ${o.pago.origem === 'empresa' ? 'pela empresa' : 'do seu bolso'}</small></div>
      <div class="v num mut">${money(o.pago.valor)}</div>
      <span class="pill ok">Pago</span>
    </div>` : `
    <div class="row">
      <div class="t">${esc(o.nome)}${['imposto', 'inss', 'contador'].includes(o.tipo) && !o.inicial ? `<small><b>vence em ${rotuloYm(nextYm(o.comp))}</b></small>` : ''}${o.detalhe ? `<small>${esc(o.detalhe)}</small>` : ''}${o.parcial ? `<small>já pago ${money(o.parcial)} de ${money(o.valor)}</small>` : ''}${o.tipo === 'inss' ? `<small><a href="#" data-inssde="${o.comp}">${o.inssDe === 'caixa' ? 'sai do caixa' : 'sai do seu líquido'} · trocar</a></small>` : ''}</div>
      <div class="v num">${money(o.pendente ?? o.valor)}</div>
      <button class="mini pay" data-pagar="${o.id}">Paguei</button>
    </div>`;
  // Imposto, INSS e contador de um mês vencem no mês seguinte; os demais, no próprio mês
  const venc = o => !o.inicial && ['imposto', 'inss', 'contador'].includes(o.tipo) ? nextYm(o.ym) : o.ym;
  const doMesObrig = r.obrig.filter(o => venc(o) === ym);
  const atrasados = r.pendentes.filter(o => venc(o) < ym);
  const aVencer = r.pendentes.filter(o => venc(o) > ym);

  const linhaReceber = ({ p, liq }) => `
    <div class="row click" data-id="${p.id}">
      <div class="t">${esc(p.nome)}<small>NF de ${rotuloYm(ymProjeto(p))} · ${money(p.bruto)} bruto</small></div>
      <div class="v num pos">${money(liq)}<small class="mut" style="display:block;font-weight:400;font-size:11px">vai ser seu</small></div>
    </div>`;

  const linhaExtrato = (e, i) => `
    <div class="row click" data-extrato="${i}">
      <div class="t">${esc(e.desc)}<small>${dataCurta(e.data)}${e.sub ? ' · ' + esc(e.sub) : ''}</small></div>
      <div class="v num ${e.valor > 0 ? 'pos' : e.valor < 0 ? '' : 'mut'}">${e.valor ? (e.valor > 0 ? '+' : '−') + money(Math.abs(e.valor)) : '—'}</div>
    </div>`;
  extratoAtual = M.movs;
  const sinal = v => (round2(v) >= 0 ? '+' : '−') + num(Math.abs(v));

  return `
    ${avisoExemplo()}
    <section class="box saldo">
      <div class="lbl">${M.atual ? `Saldo hoje (${dataCurta(M.fim)})` : `Saldo no fim de ${nomeMes}`}</div>
      <div class="big num">${money(r.saldo)}</div>
      <div class="split"><i class="e" style="width:${pE}%"></i><i class="s" style="width:${pS}%"></i></div>
      <div class="legend">
        <div><span class="dot" style="background:var(--empresa)"></span>Caixa da empresa<b class="num">${money(r.caixa)}</b></div>
        <div><span class="dot" style="background:var(--seu)"></span>Seu líquido<b class="num">${money(r.seu)}</b></div>
      </div>
      ${M.atual ? `<div class="conf"><span>${conf}</span><button class="mini" data-conferir>Conferir</button></div>` : ''}
    </section>

    <section class="box">
      <header><h2>Resumo de ${nomeMes}<small>O mês começa com o saldo em que o anterior terminou</small></h2></header>
      <table class="t4" style="margin-bottom:6px">
        <thead><tr><th></th><th>Saldo</th><th>Caixa</th><th>Seu</th></tr></thead>
        <tbody style="cursor:default">
          <tr><td>Começou</td><td class="num">${num(M.antes.saldo)}</td><td class="num">${num(M.antes.caixa)}</td><td class="num">${num(M.antes.seu)}</td></tr>
          <tr><td>Mudou</td><td class="num">${sinal(r.saldo - M.antes.saldo)}</td><td class="num">${sinal(r.caixa - M.antes.caixa)}</td><td class="num">${sinal(r.seu - M.antes.seu)}</td></tr>
        </tbody>
        <tfoot><tr><td>${M.atual ? 'Hoje' : 'Terminou'}</td><td class="num">${num(r.saldo)}</td><td class="num">${num(r.caixa)}</td><td class="num liq">${num(r.seu)}</td></tr></tfoot>
      </table>
      <div class="rows" style="padding-bottom:10px">
        <div class="row"><div class="t">Entrou na conta</div><div class="v num pos">+${money(M.entradas)}</div></div>
        <div class="row"><div class="t">Saiu da conta</div><div class="v num">−${money(M.saidas)}</div></div>
      </div>
    </section>

    <section class="box">
      <header><h2>💰 Seu líquido<small>Só sai como pró-labore ou divisão de lucros</small></h2></header>
      <div class="kpi">
        <div class="big num ${r.seu < 0 ? 'neg' : 'pos'}">${money(r.seu)}</div>
        <div class="prog"><i style="width:${prog}%"></i></div>
        <p>${textoPL}</p>
      </div>
      <div class="btns">
        <button class="main" data-lanc="prolabore">Registrar pró-labore</button>
        <button data-lanc="lucros">Divisão de lucros</button>
      </div>
    </section>

    <section class="box">
      <header><h2>🏢 Caixa da empresa<small>Reserva para boletos + colchão</small></h2></header>
      <div class="rows">
        <div class="row"><div class="t">Caixa total</div><div class="v num">${money(r.caixa)}</div></div>
        <div class="row"><div class="t">Boletos a pagar da empresa<small>imposto, contador e INSS que sai do caixa</small></div><div class="v num neg">−${money(r.aPagar)}</div></div>
        <div class="row"><div class="t"><b>Colchão hoje</b><small>meta ${money(cfg.colchao)}</small></div><div class="v num ${r.folga < 0 ? 'neg' : ''}">${money(r.folga)}</div></div>
        ${r.aPagarSeu ? `<div class="row"><div class="t">INSS que sai do seu líquido<small>não pesa no colchão: é você quem banca</small></div><div class="v num mut">−${money(r.aPagarSeu)}</div></div>` : ''}
        ${r.reservaReceber ? `<div class="row"><div class="t">Colchão depois que as NFs a receber caírem<small>+ ${money(r.reservaReceber)} de imposto e contador que vêm junto com elas</small></div><div class="v num ${r.folgaDepois < 0 ? 'neg' : ''}">${money(r.folgaDepois)}</div></div>` : ''}
      </div>
      <div style="padding:0 14px"><div class="prog e"><i style="width:${pC}%"></i></div></div>
      <div style="height:8px"></div>
      ${alertaCaixa}
    </section>

    ${atrasados.length ? `
    <section class="box">
      <header><h2>⚠ Atrasados<small>Boletos de meses anteriores ainda sem pagar</small></h2></header>
      <div class="rows">${atrasados.map(linhaObrig).join('')}</div>
    </section>` : ''}

    <section class="box">
      <header><h2>Boletos que vencem em ${nomeMes}<small>Toque em "Paguei" e diga de onde saiu</small></h2></header>
      <div class="rows">${doMesObrig.length ? doMesObrig.map(linhaObrig).join('') : '<div class="empty">Nenhum boleto vence neste mês.</div>'}</div>
    </section>

    ${aVencer.length ? `
    <section class="box">
      <header><h2>Próximos boletos<small>Ainda não vencem, mas o caixa já reserva o valor</small></h2></header>
      <div class="rows">${aVencer.map(linhaObrig).join('')}</div>
    </section>` : ''}

    <section class="box">
      <header><h2>⏳ A receber<small>NFs emitidas que ainda não tinham caído ${M.atual ? '' : `no fim de ${nomeMes}`}</small></h2></header>
      <div class="rows">${r.aReceber.length ? r.aReceber.map(linhaReceber).join('') : '<div class="empty">Nenhuma NF esperando pagamento.</div>'}</div>

      <div class="rows">${M.movs.length ? M.movs.map(linhaExtrato).join('') : '<div class="empty">Nenhum movimento neste mês.</div>'}</div>
    </section>

    ${linkConfig}`;

const linkConfig = `<p class="hint" style="text-align:center"><a href="#" data-importar>📥 Importar extrato (OFX)</a> · <a href="#" data-config>⚙️ Configurações da conta</a><br><small>configurações: ponto de partida e valores fixos (INSS, tarifa, pró-labore, colchão)</small></p>`;
let extratoAtual = [];

// Data sugerida para novos lançamentos: hoje, ou o último dia do mês que está aberto na tela
function dataPadrao() {
  if (view.mes === 'ano') return hojeISO();
  const ym = ymDe(view.ano, view.mes);
  return ym === hojeISO().slice(0, 7) ? hojeISO() : ultimoDia(ym);
}

// ================= Folha de baixo (fichas e formulários) =================
let ficha = null; // { onInput, onSubmit, onClick }

function abrirFolha(html, handlers) {
  ficha = handlers || {};
  $('form').innerHTML = html;
  if (!$('sheet').open) $('sheet').showModal();
  ficha.onInput?.();
}
const fecharFolha = () => $('sheet').close();
const cabecalho = (titulo, sub) => `
  <div class="sheet-head">
    <div><h3>${titulo}</h3>${sub ? `<span class="tag">${sub}</span>` : ''}</div>
    <button type="button" class="x" data-close aria-label="Fechar">×</button>
  </div>`;
const campo = (name, label, value = '', attrs = '') =>
  `<label class="f"><span>${label}</span><input name="${name}" value="${esc(value)}" ${attrs}></label>`;
const campoValor = (name, label, value) => campo(name, label, toInput(value), 'inputmode="decimal" placeholder="0,00"');
const campoData = (name, label, value) => campo(name, label, value, 'type="date"');

// ----- Projeto -----
let editando = null;

function abrirProjeto(p, novo) {
  editando = { ...p, novo };
  const comNF = p.tipo === 'com';
  abrirFolha(`
    ${cabecalho(novo ? 'Novo projeto' : 'Detalhes do projeto', comNF ? 'Com NF' : 'Sem NF')}
    ${campo('nome', 'Nome do projeto / cliente', p.nome, 'placeholder="Ex.: Cliente A" required')}
    <div class="grid2">
      <label class="f"><span>Mês${comNF ? ' da emissão da NF' : ''}</span><select name="mes">${MESES_LONGOS.map((m, i) => `<option value="${i}" ${i === p.mes ? 'selected' : ''}>${m}</option>`).join('')}</select></label>
      ${campoValor('bruto', 'Valor bruto', p.bruto)}
    </div>
    ${comNF ? campoData('dataEmissao', 'Data de emissão da NF (define o mês)', p.dataEmissao || '') : ''}
    <div class="grid2">
      ${CUSTOS.map(([k, l]) => campoValor(k, `${l}${descontaNoLiquido(p, k) ? '' : ' <i>(pago por você)</i>'}`, p[k])).join('')}
    </div>
    <label class="toggle"><span>${comNF ? 'Dinheiro da NF já caiu na conta?' : 'Pix já caiu no C6?'}</span><input type="checkbox" name="recebido" ${p.recebido ? 'checked' : ''}></label>
    <div id="boxRecebido">${campoData('dataRecebido', comNF ? 'Caiu na conta em' : 'Caiu no C6 em', p.dataRecebido || hojeISO())}</div>
    <div class="fech" id="fech"></div>
    <div class="actions">
      ${novo ? '' : '<button type="button" class="btn-del" data-del>Excluir</button>'}
      <button type="submit" class="btn-save">Salvar</button>
    </div>`, {
    onInput: atualizarFechamento,
    onSubmit() {
      const p = lerProjeto();
      if (!p.nome) return $('form').nome.focus();
      const { novo, ...limpo } = p;
      limpo.confirmarMes = false;
      const i = state.projetos.findIndex(x => x.id === limpo.id);
      if (i >= 0) state.projetos[i] = limpo; else state.projetos.push(limpo);
      return true;
    },
    onClick(e) {
      if (e.target.closest('[data-del]')) {
        return perguntar('Excluir este projeto?', 'Excluir').then(ok => {
          if (ok) state.projetos = state.projetos.filter(x => x.id !== editando.id);
          return ok;
        });
      }
    },
  });
}

function lerProjeto() {
  const f = $('form');
  const p = { ...editando, nome: f.nome.value.trim(), mes: +f.mes.value, bruto: parseBRL(f.bruto.value) };
  CUSTOS.forEach(([k]) => p[k] = parseBRL(f[k].value));
  if (f.dataEmissao) {
    p.dataEmissao = f.dataEmissao.value || null;
    if (p.dataEmissao) { p.ano = +p.dataEmissao.slice(0, 4); p.mes = +p.dataEmissao.slice(5, 7) - 1; }
  }
  if (f.recebido) {
    p.recebido = f.recebido.checked;
    p.dataRecebido = p.recebido ? (f.dataRecebido.value || hojeISO()) : null;
  }
  return p;
}

function atualizarFechamento() {
  const p = lerProjeto(), c = calc(p), comNF = p.tipo === 'com';
  if ($('boxRecebido')) $('boxRecebido').style.display = p.recebido ? '' : 'none';
  if (p.dataEmissao && $('form').mes) $('form').mes.value = p.mes;
  const r = (lbl, v, cls = 'minus') => `<div class="r ${cls}"><span>${lbl}</span><span class="num">− ${money(v)}</span></div>`;
  $('fech').innerHTML = `
    <div class="t">Fechamento</div>
    <div class="r"><span>Valor bruto</span><span class="num">${money(p.bruto)}</span></div>
    ${comNF ? r('Imposto (6%)', c.imposto, 'tax') + r('Contador (5%)', c.contador, 'tax') : ''}

// ================= Importar extrato do banco (arquivo OFX) =================
const prevYm = ym => { const [a, m] = ym.split('-').map(Number); return m === 1 ? `${a - 1}-12` : `${a}-${pad(m - 1)}`; };
const nextYm = ym => { const [a, m] = ym.split('-').map(Number); return m === 12 ? `${a + 1}-01` : `${a}-${pad(m + 1)}`; };
const PEQUENAS = new Set(['de', 'da', 'do', 'das', 'dos', 'e']);
const titulo = s => s.toLowerCase().replace(/(^|[\s.])(\p{L}+)/gu, (m, a, w) => a + (PEQUENAS.has(w) && a === ' ' ? w : w[0].toUpperCase() + w.slice(1)));

function lerOFX(texto) {
  const pega = (b, k) => (b.match(new RegExp('<' + k + '>([^\\r\\n<]*)')) || [])[1]?.trim() || '';
  const dia = d => `${d.slice(0, 4)}-${d.slice(4, 6)}-${d.slice(6, 8)}`;
  const todas = [...texto.matchAll(/<STMTTRN>([\s\S]*?)<\/STMTTRN>/g)].map(m => m[1]).map(b => ({
    fit: pega(b, 'FITID'), data: dia(pega(b, 'DTPOSTED')), valor: round2(parseFloat(pega(b, 'TRNAMT'))),
    memo: pega(b, 'MEMO').replace(/\s+/g, ' '),
  }));
  const ant = todas.find(t => /^SALDO ANTERIOR/i.test(t.memo));
  const ini = texto.match(/<DTSTART>(\d{8})/), fim = texto.match(/<LEDGERBAL>[\s\S]*?<DTASOF>(\d{8})/), bal = texto.match(/<BALAMT>([-\d.]+)/);
  if (!todas.length) throw new Error('Não encontrei lançamentos nesse arquivo.');
  return {
    txs: todas.filter(t => !/^SALDO/i.test(t.memo)),
    saldoAnterior: ant ? ant.valor : null,
    inicioExtrato: ini ? dia(ini[1]) : null,
    saldoFinal: bal ? parseFloat(bal[1]) : null,
    saldoFinalData: fim ? dia(fim[1]) : null,
  };
}

function classificar(t, cfg) {
  const m = t.memo.toUpperCase();
  if (t.valor > 0) return /RENDIMENTO/.test(m) ? 'rend' : 'entrada';
  if (/TAR PLANO|^TAR /.test(m)) return 'tarifa';
  if ((cfg.socios || []).some(s => m.includes(s))) return 'socio';
  if (/DARF/.test(m)) return 'darf';
  if (/SIMPLES|RECEITA FEDERAL|TRIB COD BARRAS/.test(m)) return 'simples';
  if (/APOLO|CONTABILIDADE/.test(m)) return 'contador';
  if (/PIX ENVIADO|TED ENVIADA|TRANSF/.test(m)) return 'terceiro';
  return 'outro';
}

const semDoc = s => s.replace(/\s[\d.\/-]{11,}$/, '').trim();
function nomePagador(memo) {
  let s = memo.toUpperCase()
    .replace(/^PIX RECEBIDO (?:\S+\s+)?\S*?\d{2}\/\d{2}\s+/, '')
    .replace(/^TED RECEBIDA \d+\.\d+\./, '')
    .replace(/^RECEBIMENTOS\s+(\d+\s+)?/, '');
  s = semDoc(s);
  const w = s.split(' ');
  for (let j = 2; j < w.length; j++) if (w[j] === w[0]) { s = w.slice(j).join(' '); break; } // nome truncado + nome completo
  return titulo(s);
}
function nomeDestino(memo) {
  return titulo(semDoc(memo.toUpperCase().replace(/^(PIX ENVIADO|TED ENVIADA)\s+/, '')).replace(/^[\d.]+\s+/, ''));
}

// Monta uma cópia dos dados com tudo que o extrato traz (sem mexer nos dados reais ainda).
// O extrato diz o que aconteceu na conta; os projetos (com o mês real de emissão) vêm do seu controle.
function prepararImport(P) {
  const rascunho = structuredClone(state), original = state;
  state = rascunho;
  try {
    if (rascunho.exemplo) { rascunho.projetos = []; rascunho.conta = contaVazia(); rascunho.exemplo = false; }
    const c = rascunho.conta, cfg = c.cfg;
    c.importados ||= [];
    const jaFoi = new Set(c.importados);
    const pontoNovo = !c.inicio;
    if (pontoNovo) {
      if (P.saldoAnterior == null) throw new Error('Esse extrato não traz o "saldo anterior", então não consigo montar o ponto de partida.');
      c.inicio = { data: P.inicioExtrato || P.txs[0].data.slice(0, 8) + '01', saldo: P.saldoAnterior, seu: 0, pendentes: 0, pend: [] };
    }
    const ini = c.inicio, startYm = ini.data.slice(0, 7);
    const novas = P.txs.filter(t => !jaFoi.has(t.fit) && t.data >= ini.data)
      .sort((a, b) => a.data.localeCompare(b.data) || a.fit.localeCompare(b.fit));
    if (!novas.length) throw new Error('Não há movimentos novos nesse extrato (tudo nele já foi importado).');
    const por = {}; novas.forEach(t => (por[classificar(t, cfg)] ||= []).push(t));
    const resumo = { entradas: 0, valorEntradas: 0, projetosNovos: 0, projetosLigados: 0, prolabores: 0, lucros: 0, terceiros: 0, rendimentos: 0, tarifas: 0, impostos: 0, outros: [] };
    const lanc = (tipo, valor, data, obs, extra = {}) => c.lancamentos.push({ id: uid(), tipo, valor, data, obs: obs || '', ...extra });

    // 1. Depósitos: ligam ao projeto Com NF de mesmo valor (o mais antigo que ainda não recebeu); senão, viram projeto novo
    for (const t of por.entrada || []) {
      const ym = t.data.slice(0, 7);
      const dist = p => (+ym.slice(0, 4) - p.ano) * 12 + (+ym.slice(5) - 1 - p.mes);
      const candidatos = rascunho.projetos
        .filter(p => p.tipo === 'com' && !p.fit && Math.abs(p.bruto - t.valor) < 0.01 && dist(p) >= 0 && dist(p) <= 6)
        .sort((a, b) => ymProjeto(a).localeCompare(ymProjeto(b)));
      const igual = candidatos[0];
      if (igual) { igual.recebido = true; igual.dataRecebido = t.data; igual.fit = t.fit; resumo.projetosLigados++; }
      else {
        const ymEmi = prevYm(ym), [a, m] = ymEmi.split('-').map(Number);
        rascunho.projetos.push({ id: uid(), tipo: 'com', ano: a, mes: m - 1, nome: nomePagador(t.memo), bruto: t.valor, transporte: 0, alimentacao: 0, equipe: 0, extras: 0, recebido: true, dataRecebido: t.data, importado: true, fit: t.fit, confirmarMes: true });
        resumo.projetosNovos++;
      }
      resumo.entradas++; resumo.valorEntradas = round2(resumo.valorEntradas + t.valor);
    }

    // 2. Boletos que já estavam pendentes no ponto de partida (só na primeira importação)
    if (pontoNovo) {
      const anterior = rascunho.projetos.filter(p => p.tipo === 'com' && ymProjeto(p) < startYm);
      const brutoAnt = sum(anterior.map(p => p.bruto)), compAnt = prevYm(startYm), nomeAnt = rotuloYm(compAnt);
      if (brutoAnt) {
        ini.pend.push({ id: 'ini-imp', tipo: 'imposto', comp: compAnt, nome: `Imposto 6% · ref. ${nomeAnt}`, valor: round2(brutoAnt * IMPOSTO), detalhe: `6% de ${money(brutoAnt)} em NFs emitidas antes do início` });
      }
      const darf = (por.darf || []).find(t => t.data.slice(0, 7) === startYm && +t.data.slice(8) <= 20);
      ini.pend.push({ id: 'ini-inss', tipo: 'inss', comp: compAnt, nome: `INSS · ref. ${nomeAnt}`, valor: darf ? -darf.valor : cfg.inss, detalhe: 'INSS do mês anterior ao início' });
    }

    // 3. Pagamentos viram lançamentos; o app liga cada um ao boleto certo (ver contaCalc)
    for (const t of por.simples || []) { lanc('imposto', -t.valor, t.data, 'Simples Nacional', { fit: t.fit }); resumo.impostos++; }
    for (const t of por.darf || []) { lanc('inss', -t.valor, t.data, 'DARF', { fit: t.fit }); resumo.impostos++; }
    for (const t of por.contador || []) { lanc('contador', -t.valor, t.data, 'Contador', { fit: t.fit }); resumo.impostos++; }
    for (const t of por.terceiro || []) { lanc('terceiro', -t.valor, t.data, nomeDestino(t.memo), { fit: t.fit }); resumo.terceiros++; }
    for (const t of por.outro || []) { lanc('saida', -t.valor, t.data, t.memo, { fit: t.fit }); resumo.outros.push(t); }

    // 4. Pró-labore e divisão de lucros (os dois PIX para os sócios no mesmo dia)
    const metade = round2(cfg.prolabore / 2), diaPL = {}, diaLucro = {};
    for (const t of por.socio || []) {
      const k = -t.valor / metade, ehPL = Math.abs(k - Math.round(k)) < 0.002 && Math.round(k) >= 1;
      (ehPL ? diaPL : diaLucro)[t.data] = round2(((ehPL ? diaPL : diaLucro)[t.data] || 0) - t.valor);
    }
    for (const [data, v] of Object.entries(diaPL)) { const n = Math.round(v / cfg.prolabore); lanc('prolabore', v, data, n > 1 ? `${n} pró-labores juntos` : '', { fit: 'imp' }); resumo.prolabores += Math.max(1, n); }
    for (const [data, v] of Object.entries(diaLucro)) { lanc('lucros', v, data, '', { fit: 'imp' }); resumo.lucros++; }

    // 5. Rendimentos (somados por mês) e tarifas
    const rendMes = {};
    for (const t of por.rend || []) { const ym = t.data.slice(0, 7); const r = rendMes[ym] ||= { valor: 0, data: t.data }; r.valor = round2(r.valor + t.valor); if (t.data > r.data) r.data = t.data; resumo.rendimentos++; }
    for (const r of Object.values(rendMes)) lanc('rendimento', r.valor, r.data, 'rendimentos do mês', { fit: 'imp' });
    const ultimaData = novas[novas.length - 1].data, ymUlt = ultimaData.slice(0, 7);
    for (const t of por.tarifa || []) {
      const ym = t.data.slice(0, 7);
      c.ajustes[ym] = { ...c.ajustes[ym], tarifa: -t.valor, tarifaDia: +t.data.slice(8) };
      resumo.tarifas++;
    }
    for (const ym of mesesEntre(startYm, prevYm(ymUlt))) if (!c.ajustes[ym]?.tarifaDia) c.ajustes[ym] = { ...c.ajustes[ym], tarifa: 0 };

    c.importados.push(...novas.map(t => t.fit));
    const fimExtrato = P.saldoFinalData || ultimaData, ymFim = fimExtrato.slice(0, 7);

    // 6. O que sobrou sem explicação: boletos antigos sem pagamento e pagamentos sem boleto
    const r = contaCalc(hojeISO());
    const faltando = r.pendentes.filter(o => ['imposto', 'inss', 'contador', 'equipe'].includes(o.tipo) && nextYm(o.comp) < ymFim);
    const semData = rascunho.projetos.filter(p => p.tipo === 'com' && !p.importado && !p.dataEmissao && p.ano === 2026).length;
    return { rascunho, resumo, faltando, sobras: r.sobras, pontoNovo, P, fimExtrato, semData, apagaExemplo: !!original.exemplo };
  } finally { state = original; }
}

// Aplica as escolhas da tela numa cópia e calcula como a conta ficaria
function resultadoImport(base, escolhas, seuConhecido, destinoSobras = {}) {
  const d = structuredClone(base.rascunho), original = state;
  state = d;
  try {
    const c = d.conta;
    for (const o of base.faltando) {
      const e = escolhas[o.id];
      if (e === 'bolso') {
        if (o.tipo === 'equipe') c.pagamentos[o.id] = { nome: o.nome, valor: o.valor, data: `${o.ym}-28`, origem: 'pessoal' };
        else c.lancamentos.push({ id: uid(), tipo: o.tipo + '_bolso', valor: o.pendente, data: nextYm(o.comp) + '-15', obs: o.nome, comp: o.comp, fit: 'imp' });
      }
      if (e === 'zero' && o.tipo === 'inss') c.ajustes[o.comp] = { ...c.ajustes[o.comp], inss: 0 };
      if (e === 'zero' && o.tipo === 'contador') c.ajustes[o.comp] = { ...c.ajustes[o.comp], contador: 0 };
    }
    for (const [id, comp] of Object.entries(destinoSobras)) {
      const l = c.lancamentos.find(x => x.id === id);
      if (l && comp) l.comp = comp;
    }
    let aviso = '', r = contaCalc(hojeISO());
    const ref = base.P.saldoFinal;
    if (ref != null) {
      const dif = round2(ref - r.saldo);
      if (Math.abs(dif) >= 0.01 && Math.abs(dif) <= 5) {
        c.lancamentos.push({ id: uid(), tipo: dif > 0 ? 'rendimento' : 'saida', valor: Math.abs(dif), data: base.fimExtrato, obs: 'ajuste: diferença do extrato com o banco', fit: 'imp' });
        r = contaCalc(hojeISO());
      }
    }
    const difFinal = ref != null ? round2(ref - r.saldo) : 0;
    if (Math.abs(difFinal) >= 0.01) aviso = `O saldo calculado (${money(r.saldo)}) não bateu com o do banco (${money(ref)}): diferença de ${money(difFinal)}.`;
    if (base.pontoNovo && seuConhecido) {
      c.inicio.seu = round2(seuConhecido - (r.seu - c.inicio.seu));
      r = contaCalc(hojeISO());
    }
    return { dados: d, r, aviso };
  } finally { state = original; }
}

// Sugestão inicial para boletos sem pagamento no extrato (você escolhe na tela da importação)
function sugestao(o) { return 'pend'; }

let imp = null;
function abrirImportar() {
  abrirFolha(`
    ${cabecalho('Importar extrato', 'Arquivo OFX do Itaú Empresa')}
    <p class="note">No app ou site do Itaú, baixe o extrato da conta no formato <b>OFX</b> e escolha o arquivo aqui. Nada é gravado antes de você revisar e confirmar.</p>
    <label class="f"><span>Arquivo do extrato (.ofx)</span><input type="file" name="arq" accept=".ofx,.OFX,text/plain"></label>
    <p class="note" id="impErro" style="color:var(--negative)"></p>`, {
    async onInput() {
      const f = $('form').arq?.files?.[0]; if (!f) return;
      try {
        const texto = new TextDecoder('windows-1252').decode(await f.arrayBuffer());
        imp = { base: prepararImport(lerOFX(texto)), escolhas: {}, seu: '' };
        mostrarPreviaImport();
      } catch (e) { $('impErro').textContent = e.message || 'Não consegui ler esse arquivo.'; }
    },
  });
}

function mostrarPreviaImport() {
  const { base } = imp, s = base.resumo, linha = (a, b) => `<div class="r"><span>${a}</span><span class="num">${b}</span></div>`;
  const ROT = { bolso: 'Paguei do bolso', zero: 'Foi zero (não precisava pagar)', pend: 'Ainda não paguei' };
  const contPend = base.faltando.filter(o => o.tipo === 'contador');
  abrirFolha(`
    ${cabecalho('Importar extrato', 'Revise antes de confirmar')}
    ${base.apagaExemplo ? '<div class="alert warn" style="margin:0 0 12px">Os dados de exemplo serão apagados.</div>' : ''}
    ${base.semData ? `<div class="alert" style="margin:0 0 12px">⚠ ${base.semData} projeto(s) Com NF estão <b>sem data de emissão</b>. Provavelmente você está com o arquivo de projetos antigo: feche esta janela, use <b>restaurar</b> com o <code>projetos-2026-para-restaurar.json</code> mais novo e importe de novo. Senão os boletos de imposto e contador saem com valores errados.</div>` : ''}
    <div class="fech">
      <div class="t">O que vou importar</div>
      ${linha('Depósitos', `${s.entradas} · ${money(s.valorEntradas)}`)}
      ${linha('Ligados a projetos que você já tinha', s.projetosLigados)}
      ${s.projetosNovos ? linha('Projetos novos (sem projeto seu correspondente)', s.projetosNovos) : ''}
      ${linha('Pró-labores', s.prolabores)}
      ${s.lucros ? linha('Divisões de lucros', s.lucros) : ''}
      ${s.terceiros ? linha('Pagamentos a terceiros', s.terceiros) : ''}
      ${linha('Impostos, INSS e contador pagos', s.impostos)}
      ${linha('Rendimentos e tarifas', `${s.rendimentos} · ${s.tarifas}`)}
    </div>
    ${s.projetosNovos ? '<p class="note">Os projetos novos aparecem em Projetos com o aviso "confirmar mês": o mês de emissão foi chute (um mês antes do depósito).</p>' : ''}
    ${base.sobras.length ? `
      <div class="fech">
        <div class="t">Pagamentos de contador que não bateram com nenhum boleto</div>
        ${base.sobras.map(({ l }) => `
          <label class="f" style="margin-bottom:8px"><span>${dataCurta(l.data)} · ${money(l.valor)} — foi de qual boleto?</span>
            <select name="sob" data-id="${l.id}">
              <option value="">Não sei (fica como saída solta)</option>
              ${contPend.map(o => `<option value="${o.comp}">${esc(o.nome)} · ${money(o.pendente)}</option>`).join('')}
            </select></label>`).join('')}
      </div>` : ''}
    ${base.faltando.length ? `
      <div class="fech">
        <div class="t">Boletos antigos sem pagamento no extrato</div>
        <p class="note" style="margin:0 0 8px">Já deixei preenchido com o que você me contou. Confira e só mude o que estiver errado.</p>
        ${base.faltando.map(o => `
          <label class="f" style="margin-bottom:8px"><span>${esc(o.nome)} · ${money(o.pendente)}${o.parcial ? ` (já pago ${money(o.parcial)} de ${money(o.valor)})` : ''}<br><i style="color:var(--muted)">${esc(o.detalhe || '')}${o.tipo === 'equipe' ? 'pagamento a profissional da equipe' : (o.inicial ? '' : ` · vence em ${rotuloYm(nextYm(o.comp))}`)}</i></span>
            <select name="esc" data-id="${o.id}">
              <option value="pend" ${sugestao(o) === 'pend' ? 'selected' : ''}>${ROT.pend}</option><option value="bolso" ${sugestao(o) === 'bolso' ? 'selected' : ''}>${ROT.bolso}</option>
              ${o.tipo === 'inss' ? `<option value="zero" ${sugestao(o) === 'zero' ? 'selected' : ''}>${ROT.zero}</option>` : ''}${o.tipo === 'contador' ? `<option value="zero" ${sugestao(o) === 'zero' ? 'selected' : ''}>Não considerar (não houve cobrança ou outra pessoa pagou)</option>` : ''}
            </select></label>`).join('')}
      </div>` : ''}
    ${base.pontoNovo ? campoValor('seuConhecido', 'Quanto do saldo de hoje é seu? (aproximado — deixe vazio se não souber)', '') : ''}
    <div class="fech" id="impRes"></div>
    <div class="actions"><button type="submit" class="btn-save">Importar</button></div>`, {
    onInput() {
      const f = $('form');
      imp.escolhas = {}; imp.destino = {};
      f.querySelectorAll('select[name="esc"]').forEach(sel => imp.escolhas[sel.dataset.id] = sel.value);
      f.querySelectorAll('select[name="sob"]').forEach(sel => imp.destino[sel.dataset.id] = sel.value);
      imp.seu = f.seuConhecido ? parseBRL(f.seuConhecido.value) : 0;
      imp.res = resultadoImport(imp.base, imp.escolhas, imp.seu, imp.destino);
      const r = imp.res.r;
      $('impRes').innerHTML = `
        <div class="t">Como a conta ficaria hoje</div>
        <div class="r"><span>Saldo no banco</span><span class="num">${money(r.saldo)}</span></div>
        <div class="r"><span>🏢 Caixa da empresa</span><span class="num">${money(r.caixa)}</span></div>
        <div class="r"><span>💰 Seu líquido</span><span class="num ${r.seu < 0 ? 'neg' : ''}">${money(r.seu)}</span></div>
        <div class="r"><span>Boletos a pagar</span><span class="num">${money(r.aPagar)}</span></div>
        <div class="r res ${r.folga < 0 ? 'neg' : ''}"><span>Colchão hoje</span><span class="num">${money(r.folga)}</span></div>
        ${r.reservaReceber ? `<div class="r"><span>Colchão depois que as NFs a receber caírem</span><span class="num">${money(r.folgaDepois)}</span></div>` : ''}
        ${imp.res.aviso ? `<p class="note" style="color:var(--negative);margin-top:8px">${imp.res.aviso}</p>` : ''}
        ${r.seu < 0 && !imp.seu ? '<p class="note" style="margin-top:8px">Seu líquido ficou negativo porque o ponto de partida considera tudo como caixa da empresa. Informe acima quanto do saldo de hoje é seu para acertar.</p>' : ''}`;
    },
    onSubmit() {
      state = imp.res.dados;
      view.tela = 'conta';
      view.mes = new Date().getMonth(); view.ano = new Date().getFullYear();
      try { localStorage.setItem(KEY + '.tela', 'conta'); } catch (e) {}
      return true;
    },
  });
}

// Eventos da folha
$('form').addEventListener('input', () => ficha?.onInput?.());
$('form').addEventListener('change', () => ficha?.onInput?.());
$('form').addEventListener('submit', e => {
  e.preventDefault();
  if (ficha?.onSubmit?.() === true) { save(); fecharFolha(); render(); }
});
$('form').addEventListener('click', e => {
  if (e.target.closest('[data-close]')) return fecharFolha();
  // onClick pode devolver true, ou uma promessa (quando pergunta "tem certeza?")
  Promise.resolve(ficha?.onClick?.(e)).then(ok => { if (ok === true) { save(); fecharFolha(); render(); } });
});

// Confirmação feita dentro do app (as janelinhas do navegador são bloqueadas em alguns lugares)
function perguntar(msg, ok = 'Confirmar', semCancelar = false, cancelar = 'Cancelar') {
  return new Promise(resolve => {
    const d = $('ask');
    $('askMsg').textContent = msg;
    $('askOk').textContent = ok;
    $('askNo').style.display = semCancelar ? 'none' : '';
    $('askNo').textContent = cancelar;
    const fim = v => { d.close(); resolve(v); };
    $('askOk').onclick = () => fim(true);
    $('askNo').onclick = () => fim(false);
    d.oncancel = () => resolve(false);
    d.showModal();
  });
}
$('sheet').addEventListener('click', e => { if (e.target === $('sheet')) fecharFolha(); });

// ================= Cliques nas telas =================
$('seg').addEventListener('click', e => {
  const b = e.target.closest('[data-tela]'); if (!b) return;
  irPara(b.dataset.tela);
});
$('nav').addEventListener('click', e => {
  if (e.target.closest('[data-mais]')) return abrirMais();
  const b = e.target.closest('[data-aba]'); if (b) irPara(view.ultima[b.dataset.aba]);
});
function irPara(tela) {
  view.tela = tela; view.ultima[abaDe(tela)] = tela;
  try { localStorage.setItem(KEY + '.tela', tela); } catch (e) {}
  window.scrollTo(0, 0); render();
}
$('months').addEventListener('click', e => {
  const b = e.target.closest('[data-m]'); if (!b) return;
  view.mes = b.dataset.m === 'ano' ? 'ano' : +b.dataset.m; render();
});
$('prevYear').onclick = () => { view.ano--; render(); };
$('nextYear').onclick = () => { view.ano++; render(); };

$('main').addEventListener('click', e => {
  const t = e.target;
  const cf = t.closest('[data-cfg]');
  if (cf) { e.preventDefault(); return configAcao(cf.dataset.cfg, cf.dataset.rid); }
  const to = t.closest('[data-total]');
  if (to) { e.preventDefault(); return totalAcao(to.dataset.total, to.dataset.rid); }
  const ap = t.closest('[data-aplic]');
  if (ap) { e.preventDefault(); return aplicAcao(ap.dataset.aplic, ap.dataset.rid); }
  const da = t.closest('[data-dumbo]');
  if (da) { e.preventDefault(); return dumboAcao(da.dataset.dumbo, da.dataset.rid); }
  const ca = t.closest('[data-cred]');
  if (ca) { e.preventDefault(); return credAcao(ca.dataset.cred, ca.dataset.rid); }
  const pa = t.closest('[data-poup]');
  if (pa) { e.preventDefault(); return poupAcao(pa.dataset.poup, pa.dataset.rid); }
  const c6a = t.closest('[data-c6]');
  if (c6a) { e.preventDefault(); return c6Acao(c6a.dataset.c6, c6a.dataset.rid); }
  const add = t.closest('[data-add]');
  if (add) {
    const mes = view.mes === 'ano' ? today.getMonth() : view.mes;
    return abrirProjeto({ id: uid(), tipo: add.dataset.add, ano: view.ano, mes, nome: '', bruto: 0, transporte: 0, alimentacao: 0, equipe: 0, extras: 0, recebido: false }, true);
  }
  const th = t.closest('th[data-m]');
  if (th) { view.mes = +th.dataset.m; return render(); }
  const proj = t.closest('[data-id]');
  if (proj) return abrirProjeto(state.projetos.find(p => p.id === proj.dataset.id), false);
  if (t.closest('[data-ir-conta]')) { e.preventDefault(); return irPara('conta'); }
  if (t.closest('[data-config]')) { e.preventDefault(); return abrirConfig(); }
  if (t.closest('[data-importar]')) { e.preventDefault(); return abrirImportar(); }
  if (t.closest('[data-conferir]')) return abrirConferencia();
  const inssde = t.closest('[data-inssde]');
  if (inssde) {
    e.preventDefault();
    const ym = inssde.dataset.inssde, atual = state.conta.ajustes[ym]?.inssDe || 'liquido';
    state.conta.ajustes[ym] = { ...state.conta.ajustes[ym], inssDe: atual === 'liquido' ? 'caixa' : 'liquido' };
    save(); return render();
  }
  if (t.closest('[data-backup]')) { e.preventDefault(); return baixarBackup(); }
  if (t.closest('[data-restaurar]')) { e.preventDefault(); return restaurarBackup(); }
  const lanc = t.closest('[data-lanc]');
  if (lanc) return abrirLancamento(lanc.dataset.lanc);
  const pagar = t.closest('[data-pagar]');
  if (pagar) {
    const o = contaCalc().obrig.find(o => o.id === pagar.dataset.pagar);
    if (o?.pago) return perguntar(`Esse boleto foi pago depois, em ${dataCurta(o.pago.data)}.`, 'Ok', true);
    return o && abrirPagamento(o);
  }
  const ex = t.closest('[data-extrato]');
  if (ex) return abrirItemExtrato(extratoAtual[+ex.dataset.extrato]);
  if (t.closest('[data-exemplo-conta]')) {
    e.preventDefault();
    // Exemplo: começa no mês passado, com alguns pagamentos já feitos
    const d = new Date(today.getFullYear(), today.getMonth() - 1, 1);
    const ant = ymDe(d.getFullYear(), d.getMonth());
    const c = state.conta;
    c.inicio = { data: ant + '-01', saldo: 2000, seu: 800, pendentes: 0 };
    c.pagamentos['inss-' + ant] = { nome: `INSS · ${rotuloYm(ant)}`, valor: c.cfg.inss, data: ant + '-15', origem: 'empresa' };
    c.pagamentos['cont-' + ant] = { nome: `Contador (mês sem NF) · ${rotuloYm(ant)}`, valor: c.cfg.contadorMinimo, data: ant + '-15', origem: 'pessoal' };
    c.lancamentos.push({ id: uid(), tipo: 'rendimento', valor: 18.4, data: ultimoDia(ant), obs: '' });
    save(); return render();
  }
  if (t.closest('[data-limpar]')) {
    e.preventDefault();
    perguntar('Apagar todos os dados de exemplo? Isso apaga os projetos e a conta.', 'Apagar').then(ok => {
      if (ok) { state = { exemplo: false, projetos: [], conta: contaVazia(), c6: state.c6, poup: state.poup, credito: state.credito, dumbo: state.dumbo, aplic: state.aplic, total: state.total }; save(); render(); }
    });
  }
});

function abrirItemExtrato(item) {
  const ref = item.ref;
  if (ref.projeto) return abrirProjeto(state.projetos.find(p => p.id === ref.projeto), false);
  if (ref.lanc) return abrirLancamento(null, state.conta.lancamentos.find(l => l.id === ref.lanc));
  if (ref.pagamento) {
    return perguntar(`Desfazer o pagamento "${state.conta.pagamentos[ref.pagamento].nome}"? Ele volta para "Boletos a pagar".`, 'Desfazer').then(ok => {
      if (ok) { delete state.conta.pagamentos[ref.pagamento]; save(); render(); }
    });
  }
  if (ref.tarifa) {
    const ym = ref.tarifa, atual = state.conta.ajustes[ym]?.tarifa ?? state.conta.cfg.tarifa;
    abrirFolha(`
      ${cabecalho('Tarifa do banco', rotuloYm(ym))}
      ${campoValor('tarifa', 'Valor da tarifa neste mês', atual)}
      <p class="note">Coloque 0 se o banco não cobrou nesse mês.</p>
      <div class="actions"><button type="submit" class="btn-save">Salvar</button></div>`, {
      onSubmit() {
        state.conta.ajustes[ym] = { ...state.conta.ajustes[ym], tarifa: parseBRL($('form').tarifa.value) };
        return true;
      },
    });
  }
}

render();
try { totalFoto(); } catch (e) {}
iniciarNuvem();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
document.addEventListener('visibilitychange', () => { if (!document.hidden && sessao) puxar(); });
window.addEventListener('online', () => { if (sessao) puxar(); });
</script>
</body>
</html>
